[project]
name = "mission-control-langgraph-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.6,<2", "langgraph-checkpoint-sqlite>=2,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["graph", "recovery"]
