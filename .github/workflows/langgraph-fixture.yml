name: LangGraph fixture checks

on:
  pull_request:
  push:
    branches:
      - feature/langgraph-orchestration-foundation

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/langgraph_orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check Python syntax
        run: python -m compileall -q graph.py tests
      - name: Run synthetic-only tests
        run: python -m pytest -q
