name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run controller tests
        run: npm run test:controller

      - name: Build controller
        run: npm run build:controller

      - name: Run tests
        run: npm test

      - name: Build controller
        run: npm run build:controller

      - name: Build
        run: npm run build

